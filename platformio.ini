; CydOs - a tiny "operating system" for the ESP32-2432S028R "Cheap Yellow Display" (CYD)
; Flash with: pio run -t upload   (or the PlatformIO IDE button)

[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; The default partition table only gives the app ~1.3MB, which the WiFi/TLS
; stack (needed for the update checker) eats into fast. These boards have a
; full 4MB flash chip and we don't need OTA, so use a partition table with
; one big ~3MB app slot instead.
board_build.partitions = huge_app.csv

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    paulstoffregen/XPT2046_Touchscreen
    ricmoo/QRCode @ ^0.0.1

build_flags =
    -I src
    ; ---- TFT_eSPI configuration for the CYD's ILI9341 panel ----
    ; (this is the standard "configure via build_flags" method, so you never
    ;  have to hand-edit TFT_eSPI's User_Setup.h)
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1        ; most CYD boards need the "_2" (colour-inverted) variant.
                                  ; if colours look wrong/inverted, switch this to ILI9341_DRIVER
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    ; Touch (XPT2046_Touchscreen, see src/core/Touch.h) uses the Arduino
    ; SPI object on its own dedicated pins - which without this flag is
    ; still the *same underlying VSPI hardware peripheral* TFT_eSPI
    ; defaults to on ESP32, just accessed through a different SPIClass
    ; instance. The two fight over that one physical controller on every
    ; touch read, which showed up as real visible screen glitching/
    ; flashing on actual hardware. USE_HSPI_PORT moves the display driver
    ; to the other SPI peripheral (HSPI) instead, leaving VSPI - and the
    ; touch controller - uncontested.
    -D USE_HSPI_PORT=1
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000
    ; Only fonts 1 (LOAD_GLCD), 2, 4, and 7 are used anywhere in this
    ; codebase (grep for drawString/centerText font args to confirm before
    ; adding a new one back) - fonts 6/8, GFX Free Fonts, and the
    ; SPIFFS-loaded smooth-font path are all dead weight TFT_eSPI otherwise
    ; compiles in unconditionally.
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT7=1
