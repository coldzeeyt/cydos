name: Community Edition Firmware

# Builds a second firmware image - CydOsCommunity.bin - that bakes in every
# app under community-apps/ alongside the standard app roster. The official
# CydOs.bin (built and committed manually, same as every other release) is
# never touched by this workflow: it always builds from the checked-in
# src/community_registration.inc stub, regardless of what's in this repo's
# community-apps/ directory, because this workflow never commits the
# generated (non-stub) version of that file back to the tree.
#
# On a pull request: build only, and attach the resulting .bin as a
# downloadable artifact so the app's author can test it before merge. This
# is also where a broken community app fails loudly, before anything is
# ever offered to a real user.
#
# On a push to main: build, then commit docs/firmware/CydOsCommunity.bin +
# docs/store.json + docs/community-manifest.json back to the repo, so the
# App Store page and its "Install Community Edition" button are always in
# sync with whatever's currently merged.

on:
  pull_request:
    paths:
      - "community-apps/**"
      - "scripts/generate_community.py"
      - ".github/workflows/community-firmware.yml"
  push:
    branches: [main]
    paths:
      - "community-apps/**"
      - "scripts/generate_community.py"
      - ".github/workflows/community-firmware.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO and esptool
        run: python3 -m pip install --upgrade platformio esptool

      - name: Generate community app registration (local to this runner only)
        run: python3 scripts/generate_community.py

      - name: Build firmware
        run: python3 -m platformio run -e cyd

      - name: Merge into one flashable image
        run: |
          mkdir -p docs/firmware
          python3 -m esptool --chip esp32 merge_bin -o docs/firmware/CydOsCommunity.bin \
            --flash_mode dio --flash_freq 40m --flash_size 4MB \
            0x1000 .pio/build/cyd/bootloader.bin \
            0x8000 .pio/build/cyd/partitions.bin \
            0x10000 .pio/build/cyd/firmware.bin

      - name: Upload build for the submitter to test (pull requests only)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: CydOsCommunity
          path: docs/firmware/CydOsCommunity.bin
          retention-days: 14

      - name: Write the esp-web-tools manifest (main only)
        if: github.event_name == 'push'
        run: |
          cat > docs/community-manifest.json <<'JSON'
          {
            "name": "CydOs Community Edition",
            "version": "community",
            "builds": [
              { "chipFamily": "ESP32", "parts": [ { "path": "firmware/CydOsCommunity.bin", "offset": 0 } ] }
            ]
          }
          JSON

      - name: Commit the rebuilt Community Edition (main only)
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/firmware/CydOsCommunity.bin docs/store.json docs/community-manifest.json
          if git diff --cached --quiet; then
            echo "Nothing changed, skipping commit."
            exit 0
          fi
          git commit -m "Rebuild Community Edition firmware [skip ci]"
          git push
